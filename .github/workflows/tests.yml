name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Report every combination, rather than stopping at the first failure.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Nothing to install: the project is standard library only, and the
      # window tests skip themselves where Tk cannot open a display.
      - name: Run the tests
        run: python -m unittest discover -s tests -v
