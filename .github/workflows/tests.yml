name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # A window test that wedges should fail in minutes, not sit
    # for the six hour default.
    timeout-minutes: 15

    strategy:
      # Report every combination, rather than stopping at the first failure.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Nothing to install: the project is standard library only, and the
      # window tests skip themselves where Tk cannot open a display.
      - name: Run the tests
        run: python -m unittest discover -s tests -v
        env:
          # The Windows runner has no interactive desktop. Tk does not fail
          # there, it just never returns, so the window tests are turned off
          # and only the logic runs. Linux sorts itself out: Tk raises, and
          # the window tests skip themselves.
          FOLDERSORTER_SKIP_GUI_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}
